name: Run Pytest

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14-dev' # Matches your >=3.14 constraint (using dev/pre-release build)
          cache: 'pip'

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          # [dev] installs pytest, and '-e .' installs your agent code in editable mode
          pip install -e .[dev]

      - name: Run pytest
        run: pytest
